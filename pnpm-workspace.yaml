publicHoistPattern:
  - '*vitest*'
  - vite-node
allowBuilds:
  esbuild: true
  oxc-resolver: true
catalog:
  vite: npm:@voidzero-dev/vite-plus-core@0.2.9
  vitest: 4.1.10
  vite-plus: 0.2.9
  '@vitest/coverage-istanbul': 4.1.10
  '@vitest/ui': 4.1.10
overrides:
  vite: 'catalog:'
  vitest: 'catalog:'
peerDependencyRules:
  allowAny:
    - vite
    - vitest
  allowedVersions:
    vite: '*'
    vitest: '*'
