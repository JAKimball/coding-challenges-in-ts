description: Prepares the repo for a typical CI job

name: Prepare

runs:
  steps:
    - uses: pnpm/action-setup@v4
    # Node version source of truth: package.json devEngines.runtime
    - run: echo "node_version=$(node -p "require('./package.json').devEngines.runtime.version")" >> "$GITHUB_ENV"
      shell: bash
    - uses: actions/setup-node@v4
      with:
        cache: pnpm
        node-version: ${{ env.node_version }}
    - run: pnpm install --frozen-lockfile
      shell: bash
  using: composite
