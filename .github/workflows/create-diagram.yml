name: Generate Repository Diagram

# On-demand only (workflow_dispatch): per-push generation produced unsigned
# bot commits on every push (repo-visualizer commits as its own bot identity
# and cannot sign), and the README diagram does not need continuous
# freshness. Run manually from the Actions tab when the codebase structure
# has changed meaningfully. Rationale: ai-collaboration-guides
# markdown/decisions/0003-diagram-generation-on-demand.md.
on:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4
        with:
          token: ${{ secrets.DIAGRAM_TOKEN }}

      - name: Generate diagram
        uses: githubocto/repo-visualizer@0.9.1
        with:
          output_file: ./assets/images/diagram.svg
          token: ${{ secrets.DIAGRAM_TOKEN }}
